[project]
name = "connector-1c-odata"
version = "0.1.0"
description = "Repo 1: 1C OData API connector (Flask + SQLAlchemy + PostgreSQL + APScheduler)"
readme = "README.md"
authors = [{ name = "1C_PROPLAN_CONNECTOR team" }]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-admin>=1.6",
    "flask-migrate>=4.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "apscheduler>=3.10,<4.0",
    "structlog>=24.1",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-flask-cors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # конфликтует с ruff format
    "D203",     # несовместимо с D211
    "D213",     # несовместимо с D212
    "CPY001",   # copyright-заголовок не требуется в каждом файле
    "TRY003",   # длинные сообщения об ошибках допустимы (русский текст ТЗ)
    "EM101",    # literal в исключении — см. TRY003
    "EM102",    # f-string в исключении — см. TRY003
    "RUF001",   # кириллица в строках — проект русскоязычный
    "RUF002",   # кириллица в docstring — проект русскоязычный
    "RUF003",   # кириллица в комментариях — проект русскоязычный
    "FBT001",   # булевы позиционные аргументы (echo, create_tables)
    "ANN401",   # stream: Any — стандартный паттерн для logging-потоков
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG", "PLR2004", "INP001", "DTZ001", "SLF001", "PLC0415", "TC003", "PT022", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/core"]

[tool.coverage.report]
fail_under = 80
show_missing = true
